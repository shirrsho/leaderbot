services:
  leaderbot:
    build: .
    image: leaderbot:latest
    container_name: leaderbot
    restart: unless-stopped
    ports:
      # Bind only to localhost — for local/direct access. The prod tunnel
      # (see docker-compose.prod.yml) reaches the app over the docker
      # network instead, not through this port.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      LEADS_DB_PATH: /app/data/leads.db
    volumes:
      - leaderbot-data:/app/data

volumes:
  leaderbot-data:
