name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax/import sanity)
        run: python -m compileall -q .

      - name: Build Docker image (no push)
        run: docker build -t leaderbot:ci .

  docker:
    name: Build & push Docker image
    needs: build-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            itzwasik/leaderbot:latest
            itzwasik/leaderbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Write .env and redeploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: ENV_FILE_CONTENT
          script: |
            set -euo pipefail
            DEPLOY_DIR="/home/${{ secrets.VPS_USERNAME }}/redelevators/leaderbot"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Env vars come from the ENV_FILE GitHub secret, written fresh on every deploy.
            printf '%s\n' "$ENV_FILE_CONTENT" > .env

            docker pull itzwasik/leaderbot:latest
            docker stop leaderbot 2>/dev/null || true
            docker rm leaderbot 2>/dev/null || true
            docker run -d \
              --name leaderbot \
              --restart unless-stopped \
              -p 127.0.0.1:3500:3500 \
              --env-file .env \
              -v leaderbot-data:/app/data \
              itzwasik/leaderbot:latest
            docker image prune -f
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
